# CI smoke test only: the production stack, but the dashboard is served on
# https://localhost with Caddy's internal CA (no Let's Encrypt requests) and
# the ports are bound to the loopback interface.
services:
  caddy:
    environment:
      PC_DASHBOARD_ADDRESS: "localhost"
    ports: !override
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8081:80"
